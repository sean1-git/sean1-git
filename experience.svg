<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    .heading {
      animation: appear 0.8s ease-out both;
    }

    .current {
      animation: appear 0.8s ease-out 0.3s both;
    }

    .previous {
      animation: appear 0.8s ease-out 0.6s both;
    }

    .badge {
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading, .current, .previous, .badge {
        animation: none;
      }
    }
  </style>

  <rect x="0.5" y="0.5" width="799" height="299"
        rx="16" fill="#050505" stroke="#303030"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g class="heading">
      <text x="48" y="44" fill="#818895" font-size="11"
            letter-spacing="2">EXPERIENCE</text>
      <text x="48" y="71" fill="#f3f4f6" font-size="24"
            font-weight="700">sean1-git</text>
    </g>

    <g class="current">
      <rect class="badge" x="48" y="96" width="42" height="42"
            rx="9" fill="#172033"/>
      <text x="69" y="122" fill="#93c5fd" font-size="12"
            font-weight="700" text-anchor="middle">UCM</text>

      <text x="110" y="109" fill="#f3f4f6" font-size="17"
            font-weight="700">Software Engineer</text>
      <text x="110" y="131" fill="#a1a1aa" font-size="14">
        Undergraduate Research @UCM
      </text>
      <text x="110" y="153" fill="#818895" font-size="11"
            letter-spacing="1">AUG 2026 — PRESENT</text>
    </g>

    <g class="previous">
      <rect class="badge" x="48" y="182" width="42" height="42"
            rx="9" fill="#20172e"/>
      <text x="69" y="209" fill="#c4b5fd" font-size="18"
            font-weight="700" text-anchor="middle">T</text>

      <text x="110" y="195" fill="#f3f4f6" font-size="17"
            font-weight="700">Software Engineer</text>
      <text x="110" y="217" fill="#a1a1aa" font-size="14">
        Techordia
      </text>
      <text x="110" y="239" fill="#818895" font-size="11"
            letter-spacing="1">JUL 2026 — AUG 2026</text>
    </g>
  </g>
</svg>
